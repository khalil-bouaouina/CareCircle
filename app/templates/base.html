<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CareCircle{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head %}{% endblock %}
  </head>
  {% set layout = layout | default('console') %}
  <body class="bg-white text-gray-900
    {%- if layout == 'elder' %} max-w-2xl mx-auto p-8 text-xl leading-relaxed
    {%- elif layout == 'worker' %} max-w-md mx-auto p-5 text-lg
    {%- else %} max-w-3xl mx-auto p-6 text-base{% endif %}">
    {% block content %}{% endblock %}
  </body>
</html>
